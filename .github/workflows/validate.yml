name: Validate templates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate registry and template files
        run: python3 scripts/validate_registry.py
      - name: Validate Compose files
        run: |
          for file in templates/*/docker-compose.yml; do
            template_dir="$(dirname "$file")"
            cp "$template_dir/.env.example" "$template_dir/.env"
            DB_PASSWORD=ci-only-validation-placeholder docker compose --project-directory "$template_dir" --env-file "$template_dir/.env" -f "$file" config --quiet
            rm "$template_dir/.env"
          done
