x-arcane:
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/paperless-ngx.svg
  urls:
    - https://docs.paperless-ngx.com/
    - https://github.com/paperless-ngx/paperless-ngx

services:
  broker:
    image: docker.io/valkey/valkey:9-alpine
    volumes:
      - paperless-broker-data:/data
    restart: unless-stopped

  db:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD:?Set PAPERLESS_DB_PASSWORD in the project .env before deploying}
    volumes:
      - paperless-db-data:/var/lib/postgresql
    restart: unless-stopped

  webserver:
    image: docker.io/paperlessngx/paperless-ngx:latest
    depends_on:
      - db
      - broker
      - gotenberg
      - tika
    ports:
      - "${PAPERLESS_PORT:-8010}:8000"
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
      - ./consume:/usr/src/paperless/consume
      - ./export:/usr/src/paperless/export
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD:?Set PAPERLESS_DB_PASSWORD in the project .env before deploying}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?Set PAPERLESS_SECRET_KEY in the project .env before deploying}
      PAPERLESS_TIME_ZONE: ${TZ:-Europe/Berlin}
      PAPERLESS_OCR_LANGUAGE: ${PAPERLESS_OCR_LANGUAGE:-deu+eng}
      PAPERLESS_TIKA_ENABLED: "1"
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
    restart: unless-stopped

  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.37
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=file:///tmp/.*
    restart: unless-stopped

  tika:
    image: docker.io/apache/tika:3.3.1.0
    restart: unless-stopped

volumes:
  paperless-broker-data:
  paperless-db-data:
  paperless-data:
  paperless-media:
