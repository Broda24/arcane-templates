x-arcane:
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/n8n.svg
  urls:
    - https://n8n.io/
    - https://docs.n8n.io/hosting/installation/docker/

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    ports:
      - "${N8N_BIND:-127.0.0.1}:${N8N_PORT:-5678}:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in the project .env}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      GENERIC_TIMEZONE: ${TZ:-Europe/Berlin}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - n8n-data:/home/node/.n8n
    restart: unless-stopped

volumes:
  n8n-data:
