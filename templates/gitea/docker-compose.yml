x-arcane:
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/gitea.svg
  urls:
    - https://about.gitea.com/
    - https://docs.gitea.com/installation/install-with-docker

services:
  gitea:
    image: docker.gitea.com/gitea:1.27.3
    ports:
      - "${GITEA_HTTP_PORT:-3003}:3000"
      - "${GITEA_SSH_PORT:-2222}:22"
    environment:
      USER_UID: ${PUID:-1000}
      USER_GID: ${PGID:-1000}
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT:-2222}
      GITEA__server__ROOT_URL: ${GITEA_ROOT_URL:-http://localhost:3003/}
    volumes:
      - gitea-data:/data
    restart: unless-stopped

volumes:
  gitea-data:
