x-arcane:
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/trilium-notes.svg
  urls:
    - https://triliumnotes.org/
    - https://github.com/TriliumNext/Trilium

services:
  trilium:
    image: docker.io/triliumnext/trilium:latest
    ports:
      - "${TRILIUM_PORT:-8080}:8080"
    environment:
      TRILIUM_DATA_DIR: /home/node/trilium-data
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - trilium-data:/home/node/trilium-data
    restart: unless-stopped

volumes:
  trilium-data:
