x-arcane:
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/backrest.svg
  urls:
    - https://garethgeorge.github.io/backrest/
    - https://github.com/garethgeorge/backrest

services:
  backrest:
    image: docker.io/garethgeorge/backrest:latest
    ports:
      - "${BACKREST_BIND_ADDRESS:-127.0.0.1}:${BACKREST_HOST_PORT:-9898}:9898"
    volumes:
      - backrest-config:/config
      - backrest-data:/data
      - backrest-cache:/cache
      - backrest-rclone:/root/.config/rclone
      - "${BACKREST_SOURCE_PATH:-./backup-source}:/userdata:ro"
      - "${BACKREST_RESTORE_PATH:-./restore-target}:/restore"
      - "${BACKREST_REPOSITORY_PATH:-./repositories}:/repos"
    environment:
      BACKREST_PORT: "0.0.0.0:9898"
      BACKREST_CONFIG: /config/config.json
      BACKREST_DATA: /data
      XDG_CACHE_HOME: /cache
      TMPDIR: /tmp
      TZ: "${TZ:-Etc/UTC}"
    restart: unless-stopped

volumes:
  backrest-config:
  backrest-data:
  backrest-cache:
  backrest-rclone:
