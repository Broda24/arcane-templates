x-arcane:
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/nextcloud.svg
  urls:
    - https://nextcloud.com/
    - https://github.com/nextcloud/docker

services:
  db:
    image: docker.io/library/mariadb:11.4
    command: ["--transaction-isolation=READ-COMMITTED", "--binlog-format=ROW"]
    environment:
      MARIADB_DATABASE: nextcloud
      MARIADB_USER: nextcloud
      MARIADB_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?Set NEXTCLOUD_DB_PASSWORD in the project .env}
      MARIADB_ROOT_PASSWORD: ${NEXTCLOUD_DB_ROOT_PASSWORD:?Set NEXTCLOUD_DB_ROOT_PASSWORD in the project .env}
    volumes:
      - nextcloud-db:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:7-alpine
    volumes:
      - nextcloud-redis:/data
    restart: unless-stopped

  app:
    image: docker.io/library/nextcloud:apache
    depends_on:
      - db
      - redis
    ports:
      - "${NEXTCLOUD_PORT:-8089}:80"
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?Set NEXTCLOUD_DB_PASSWORD in the project .env}
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:?Set NEXTCLOUD_ADMIN_USER in the project .env}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?Set NEXTCLOUD_ADMIN_PASSWORD in the project .env}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:-localhost}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - nextcloud-data:/var/www/html
    restart: unless-stopped

volumes:
  nextcloud-db:
  nextcloud-redis:
  nextcloud-data:
